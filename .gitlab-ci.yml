workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^(dev|staging|prod)-[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$/'
    - when: never

stages: [validate, image, promote]

variables:
  RELEASE_BRANCH: main
  LAB_REGISTRY_HOST: registry-gitlab.dungxbuif.com
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: /certs
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  DOCKER_DRIVER: overlay2
  DOCKER_BUILDKIT: "1"

validate:
  stage: validate
  image: node:20-bookworm-slim
  tags: [homelab-mac]
  script:
    - npm ci
    - npm install --no-save --package-lock=false "@rollup/rollup-linux-x64-gnu@4.63.1"
    - npm test
    - npm run build --workspace @mezonhook/web

release_branch_guard:
  stage: validate
  image: alpine:3.20
  tags: [homelab-mac]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^(dev|staging|prod)-[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$/'
    - when: never
  script:
    - apk add --no-cache git
    - git fetch --no-tags origin "$RELEASE_BRANCH"
    - git merge-base --is-ancestor "$CI_COMMIT_SHA" "origin/$RELEASE_BRANCH"

publish_image:
  stage: image
  image: docker:27.5.1-cli
  services:
    - name: docker:27.5.1-dind-rootless
      alias: docker
  tags: [homelab-mac]
  needs:
    - job: validate
    - job: release_branch_guard
      optional: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^(dev|staging|prod)-[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$/'
    - when: never
  script: |
    docker info
    image="$LAB_REGISTRY_HOST/$CI_PROJECT_PATH:$CI_COMMIT_TAG"
    printf '%s' "$LAB_REGISTRY_PUSH_PASSWORD" | docker login "$LAB_REGISTRY_HOST" --username "$LAB_REGISTRY_PUSH_USER" --password-stdin
    docker build --pull --platform linux/amd64 -t "$image" .
    docker run --rm "$image" wget -qO- --timeout=3 http://127.0.0.1:8080/ >/dev/null
    docker push "$image"
    digest_ref="$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')"
    printf 'RELEASE_IMAGE=%s\nRELEASE_DIGEST=%s\n' "${digest_ref%@*}" "${digest_ref#*@}" > release.env
  artifacts:
    reports:
      dotenv: release.env
    expire_in: 30 days
  after_script:
    - docker logout "$LAB_REGISTRY_HOST" >/dev/null 2>&1 || true

promote:homelab-ops:
  stage: promote
  image: alpine/git:2.47.2
  tags: [homelab-mac]
  needs:
    - job: publish_image
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^prod-[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$/'
    - when: never
  script:
    - sh scripts/promote-homelab-ops.sh
